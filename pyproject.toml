[project]
name = "pdfplay"
version = "0.1.0"
description = "A playground for comparing PDF parsing libraries on the same document, with bounding-box overlays and document-class scoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pypdfium2>=4.30",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Local, heavier layout models
layout = ["pymupdf4llm>=1.28", "pymupdf-layout>=1.28"]
docling = ["docling>=2.0"]
unstructured = ["unstructured[pdf]>=0.15"]
marker = ["marker-pdf>=1.0"]
ocr = ["pytesseract>=0.3.10"]
# Remote vision models
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
mistral = ["httpx>=0.27"]
# One dependency that reaches every provider, and prices the calls it makes.
# litellm imports tenacity without declaring it, so it is pinned here instead.
litellm = ["litellm>=1.93", "tenacity>=8.0"]
vision = [
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    "litellm>=1.93",
    "tenacity>=8.0",
]
dev = ["pytest>=8.0", "httpx>=0.27", "openai>=1.40", "litellm>=1.93", "tenacity>=8.0"]

[project.scripts]
pdfplay = "pdfplay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
